<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CornScan AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        :root { --sidebar-bg: #064e3b; --accent-color: #10b981; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Sidebar Styling */
        .sidebar { width: 260px; height: 100vh; background: var(--sidebar-bg); position: fixed; padding: 20px; color: #fff; }
        .sidebar h4 { font-weight: 700; text-align: center; margin-bottom: 2rem; border-bottom: 1px solid #065f46; padding-bottom: 1rem; }
        .nav-link { color: #a7f3d0 !important; padding: 12px 18px; border-radius: 8px; margin-bottom: 8px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: #065f46; color: white !important; font-weight: 600; }
        
        /* Main Content Styling */
        .main-wrapper { margin-left: 260px; padding: 40px; min-height: 100vh; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h4>CornScan AI</h4>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="/" class="nav-link {{ 'active' if active_page == 'dashboard' }}">
                    <i class="bi bi-grid-fill me-2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="/statistik" class="nav-link {{ 'active' if active_page == 'statistik' }}">
                    <i class="bi bi-bar-chart-fill me-2"></i> Statistik
                </a>
            </li>
            <li class="nav-item">
                <a href="/riwayat" class="nav-link {{ 'active' if active_page == 'riwayat' }}">
                    <i class="bi bi-clock-history me-2"></i> Riwayat Diagnosa
                </a>
            </li>
            <li class="nav-item">
                <a href="/pengaturan" class="nav-link {{ 'active' if active_page == 'pengaturan' }}">
                    <i class="bi bi-person-gear me-2"></i> Pengaturan Profil
                </a>
            </li>
            <hr style="opacity: 0.2; margin: 20px 0;">
            <li class="nav-item">
                <a href="/logout" class="nav-link text-danger">
                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                </a>
            </li>
        </ul>
    </nav>

    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted mt-5" style="margin-left: 260px; font-size: 0.8rem;">
        &copy; 2025 CornScan AI | Iin Wulandari
    </footer>

</body>
</html>
