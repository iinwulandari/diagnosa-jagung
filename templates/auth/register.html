<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | CornCare AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h2 style="color: #064e3b; font-weight: 600; margin-bottom: 25px; text-align: center;">Daftar Akun</h2>
        <form action="/register" method="POST">
            <div class="input-group">
                <input type="text" name="nama" placeholder="Nama Lengkap" required>
            </div>
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="input-group" style="position: relative;">
                <input type="password" name="password" id="password" placeholder="Password" required style="padding-right: 45px;">
                <span onclick="togglePassword()" style="position: absolute; right: 15px; top: 12px; cursor: pointer; display: flex; align-items: center;">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>
            <button type="submit" class="btn-primary">Daftar Sekarang</button>
        </form>
        <p style="text-align:center; margin-top:20px; font-size: 14px; color: #64748b;">
            Sudah punya akun? <a href="/login" style="color: #059669; font-weight: 600; text-decoration: none;">Login</a>
        </p>
    </div>

    <script>
    function togglePassword() {
        const p = document.getElementById("password");
        const icon = document.getElementById("eye-icon");
        if (p.type === "password") {
            p.type = "text";
            icon.style.stroke = "#059669";
        } else {
            p.type = "password";
            icon.style.stroke = "#64748b";
        }
    }
    </script>
</body>
</html>
